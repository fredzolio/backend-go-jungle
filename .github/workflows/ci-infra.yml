# Infrastructure and spec linting (called from ci.yml as `infra-lint`).
name: ci-infra

on:
  workflow_call:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        stack: [platform, edge-lab]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4 # keep in sync with TF_IMAGE in the Makefile
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff infra/terraform
      - name: terraform validate
        working-directory: infra/terraform/stacks/${{ matrix.stack }}
        run: |
          terraform init -backend=false -lockfile=readonly >/dev/null
          terraform validate

  hadolint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [Dockerfile, infra/keycloak/Dockerfile, infra/terraform/edge.Dockerfile, infra/terraform/runner.Dockerfile]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  workflows-and-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: false }
      # shellcheck is preinstalled on ubuntu-latest and picked up by actionlint for run: blocks.
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck
      - run: docker compose config -q

  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: npx --yes @stoplight/spectral-cli@6.17.0 lint api/openapi.yaml
