# Release PRs from Conventional Commits. When a release PR is merged, the image that CI
# already built, scanned and signed for the release commit is PROMOTED by digest to
# vX.Y.Z and latest (no rebuild, so the digest and its signature stay the same).
#
# Manifest starts at 0.0.0 with bump-minor-pre-major, so the first `feat` yields 0.1.0.
# Note: PRs opened with GITHUB_TOKEN do not trigger other workflows; use a PAT/App token
# in the `token:` input if CI must run on the release PR.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/fredzolio/backend-go-jungle

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  promote:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # The image of the release commit is built by the push-to-main pipeline, which may
      # still be running: wait for its sha tag (up to ~30 min).
      - name: Wait for the release commit image
        id: src
        run: |
          set -euo pipefail
          src="${IMAGE}:sha-${RELEASE_SHA:0:12}"
          for _ in $(seq 1 90); do
            if digest=$(docker buildx imagetools inspect "$src" --format '{{json .Manifest}}' 2> /dev/null | jq -er .digest); then
              echo "src=${src}" >> "$GITHUB_OUTPUT"
              echo "ref=${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          echo "image ${src} was never published" >&2
          exit 1

      - name: Verify the signature of the source image
        env:
          REF: ${{ steps.src.outputs.ref }}
        run: |
          cosign verify "$REF" \
            --certificate-identity-regexp '^https://github\.com/fredzolio/backend-go-jungle/\.github/workflows/.+@refs/heads/main$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      - name: Promote by digest (no rebuild)
        env:
          SRC: ${{ steps.src.outputs.src }}
        run: |
          docker buildx imagetools create -t "${IMAGE}:${TAG_NAME}" -t "${IMAGE}:latest" "$SRC"

      - name: Verify the promoted tags carry the same signed digest
        env:
          REF: ${{ steps.src.outputs.ref }}
        run: |
          for t in "$TAG_NAME" latest; do
            got=$(docker buildx imagetools inspect "${IMAGE}:${t}" --format '{{json .Manifest}}' | jq -r .digest)
            [[ "${IMAGE}@${got}" == "$REF" ]] || { echo "tag $t points at $got, expected $REF" >&2; exit 1; }
          done
          cosign verify "${IMAGE}:${TAG_NAME}" \
            --certificate-identity-regexp '^https://github\.com/fredzolio/backend-go-jungle/\.github/workflows/.+@refs/heads/main$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
