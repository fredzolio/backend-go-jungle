# Reusable: build -> Trivy scan -> (optionally) push to GHCR, attest and sign the image.
#
# Required caller permissions (a reusable workflow can only downgrade the caller's token):
#   contents: read          checkout
#   packages: write         push to ghcr.io
#   id-token: write         keyless cosign + build provenance attestation (OIDC)
#   attestations: write     actions/attest-build-provenance
#   security-events: write  Trivy SARIF upload
#
# push=false builds and scans only (used for PRs and manual testing).
name: release-image

on:
  workflow_call:
    inputs:
      push:
        description: Push, attest and sign the image (false = build and scan only)
        type: boolean
        required: true
    outputs:
      image:
        description: Image repository
        value: ${{ jobs.image.outputs.image }}
      digest:
        description: Manifest digest (empty when push=false)
        value: ${{ jobs.image.outputs.digest }}
      ref:
        description: Immutable reference image@digest (empty when push=false)
        value: ${{ jobs.image.outputs.ref }}
      tag:
        description: sha-<first 12 chars of the commit>
        value: ${{ jobs.image.outputs.tag }}
  workflow_dispatch: {} # manual runs never push
  push: # TEMP-CD-TEST
    branches: [cd/lab-deploy]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/fredzolio/backend-go-jungle

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    outputs:
      image: ${{ env.IMAGE }}
      digest: ${{ steps.push.outputs.digest }}
      ref: ${{ steps.ref.outputs.ref }}
      tag: ${{ steps.out.outputs.tag }}
    env:
      DO_PUSH: ${{ inputs.push || false }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - id: out
        run: |
          tag="sha-${GITHUB_SHA:0:12}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # Build once into the local daemon so the exact bits are scanned before any push.
      - name: Build (local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: ${{ !cancelled() && hashFiles('trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Log in to GHCR
        if: env.DO_PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Layers come from the GHA cache, so this is the same build that was just scanned.
      - name: Push (with SBOM and max provenance)
        id: push
        if: env.DO_PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

      - name: Compute image ref
        if: env.DO_PUSH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
        id: ref

      - name: Attest build provenance
        if: env.DO_PUSH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.DO_PUSH == 'true'
        with:
          cosign-release: v3.1.3

      - name: Sign image (cosign keyless)
        if: env.DO_PUSH == 'true'
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: cosign sign --yes "$REF"
