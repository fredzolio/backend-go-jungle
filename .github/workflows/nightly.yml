# Nightly: flake hunting, load-test regression gate and fresh CVE scans.
name: nightly

on:
  pull_request: # TEMP: validate on branch
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: k6 duration
        default: 60s

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.27.1

jobs:
  system-repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      # Same suite as make test-system, repeated to surface flakes.
      - run: go test -tags=system -count=3 -timeout=40m -v ./test/system/... 2>&1 | tee system-repeat.log
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: system-repeat-logs
          path: system-repeat.log
          retention-days: 7

  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: docker compose up --build -d --wait
      - name: k6 (thresholds in test/load/wagering.js fail the step on regression)
        run: make load-test DURATION="${{ inputs.duration || '60s' }}"
      - name: Summary
        if: always()
        run: |
          f=test/load/last-summary.json
          [ -f "$f" ] || exit 0
          {
            echo "### k6 load test"
            echo "| metric | value |"; echo "|---|---|"
            jq -r '.metrics | "| requests | \(.http_reqs.count) (\(.http_reqs.rate|floor)/s) |",
              "| failed rate | \(.http_req_failed.value // .http_req_failed.rate) |",
              "| submit p95 ms | \(.["http_req_duration{name:submit}"]["p(95)"]|floor) |",
              "| submit p99 ms | \(.["http_req_duration{name:submit}"]["p(99)"]|floor) |",
              "| checks pass rate | \(.checks.value // .checks.rate) |"' "$f"
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-summary
          path: test/load/last-summary.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Dump stack state
        if: failure()
        run: docker compose logs --no-color --tail=500 > compose-logs.txt 2>&1 || true
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-compose-logs
          path: compose-logs.txt
          retention-days: 7
      - if: always()
        run: docker compose down -v

  security:
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    uses: ./.github/workflows/ci-security.yml

  report:
    needs: [system-repeat, load-test, security]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create nightly-failure --color B60205 --description "Nightly workflow failed" 2>/dev/null || true
          body="Nightly run failed: ${RUN_URL}"
          n=$(gh issue list --label nightly-failure --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --label nightly-failure --title "Nightly failure" --body "$body"
          fi
