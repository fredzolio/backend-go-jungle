http:
  routers:
    # Public: only what client_credentials needs (token, JWKS, discovery) of realm "jungle".
    # Admin console, master realm, account console and login pages stay private.
    keycloak-realm:
      entryPoints: [web]
      rule: "PathRegexp(`^/auth/realms/jungle/(protocol/openid-connect/(token|certs)|\\.well-known/openid-configuration)$`)"
      service: keycloak
      priority: 100
    api:
      entryPoints: [web]
      rule: "PathPrefix(`/`)"
      service: jungle-api
      middlewares: [rate-limit]
      priority: 1

    # Private entrypoint.
    keycloak-admin:
      entryPoints: [admin]
      rule: "PathPrefix(`/auth`)"
      service: keycloak
    dashboard:
      entryPoints: [admin]
      rule: "PathPrefix(`/api`) || PathPrefix(`/dashboard`)"
      service: api@internal

  middlewares:
    rate-limit:
      rateLimit:
        average: 200
        burst: 400

  services:
    keycloak:
      loadBalancer:
        servers:
          - url: "http://keycloak:8080"
    jungle-api:
      loadBalancer:
        healthCheck:
          path: /health/ready
          interval: 2s
          timeout: 1s
        servers:
          - url: "http://api-1:8080"
          - url: "http://api-2:8080"
          - url: "http://api-3:8080"
